<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Calcolo costi di trasporto</title>
  <meta http-equiv="refresh" content="2; url=../calcolo-trasporti/">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F2F4F6;color:#17202B;
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;text-align:center;padding:24px}
    h1{font-size:26px;margin:0 0 8px}
    p{color:#5A6878;margin:0 0 20px}
    a{display:inline-block;background:#C4161C;color:#fff;text-decoration:none;font-weight:700;padding:12px 20px;border-radius:8px}
    @media (prefers-color-scheme: dark){ body{background:#131920;color:#E7ECF1} p{color:#9AA8B6} }
  </style>
</head>
<body>
  <main>
    <h1>L'app si è spostata</h1>
    <p>Il calcolo dei costi di trasporto ora è nella nuova app. Ti porto lì…</p>
    <a href="../calcolo-trasporti/">Apri la nuova app</a>
  </main>
  <script>
    // chiude la vecchia app installata: toglie il service worker e i dati salvati, poi apre la nuova
    (async () => {
      try{
        const regs = await navigator.serviceWorker?.getRegistrations?.() || [];
        await Promise.all(regs.filter((r) => /Trasporti-Use-Friendly/i.test(r.scope)).map((r) => r.unregister()));
        if(window.caches){ const k = await caches.keys(); await Promise.all(k.map((x) => caches.delete(x))); }
      }catch{}
      location.replace("../calcolo-trasporti/");
    })();
  </script>
</body>
</html>
